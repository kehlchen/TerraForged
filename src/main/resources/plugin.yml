name: RealisticWorld
version: '${version}'
main: dev.kehlchen.terraforged.TerraForgedPlugin
api-version: '26.1.1'
load: STARTUP
description: Custom terrain generation with tall mountains, climate-based biomes, lakes and detailed deserts.

commands:
  terraforged:
    description: terraforged commands
    usage: /<command> <create|info|tp|locate|preview|mountain|version>
    aliases: [tf]
    permission: terraforged.admin
permissions:
  terraforged.admin:
    description: Allows all /terraforged subcommands
    default: op
